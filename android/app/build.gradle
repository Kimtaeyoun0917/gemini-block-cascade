plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kimtaeyoun.tetris'
    compileSdk 34

    defaultConfig {
        applicationId "com.kimtaeyoun.tetris"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // 서명은 워크플로에서 zipalign + apksigner 로 처리한다 (unsigned 로 빌드).
    packaging {
        resources {
            excludes += ['META-INF/*.kotlin_module']
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
