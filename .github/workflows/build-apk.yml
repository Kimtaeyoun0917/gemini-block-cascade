name: Build signed tetris.apk

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'tetris/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Copy tetris web app into app assets
        run: |
          set -euo pipefail
          DEST=android/app/src/main/assets/www
          mkdir -p "$DEST"
          for f in index.html manifest.json sw.js icon-192.png icon-512.png; do
            if [ ! -f "tetris/$f" ]; then
              echo "::error::missing tetris/$f"
              exit 1
            fi
            cp -f "tetris/$f" "$DEST/$f"
          done
          echo "assets/www:"
          ls -la "$DEST"

      - name: Build release APK (unsigned)
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Zipalign and sign (v1 + v2 + v3)
        run: |
          set -euo pipefail
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          echo "build-tools: $BUILD_TOOLS"
          ZIPALIGN="$BUILD_TOOLS/zipalign"
          APKSIGNER="$BUILD_TOOLS/apksigner"

          UNSIGNED=android/app/build/outputs/apk/release/app-release-unsigned.apk
          if [ ! -f "$UNSIGNED" ]; then
            echo "::error::unsigned APK not found"
            find android/app/build/outputs -type f || true
            exit 1
          fi

          # 빌드용(임시) 서명 키. 매 빌드마다 새로 만들어진다.
          STORE_PASS="tetris-build-$(date -u +%Y%m%d)-local"
          KS="$RUNNER_TEMP/release.keystore"
          keytool -genkeypair -v -keystore "$KS" -alias tetris \
            -keyalg RSA -keysize 2048 -validity 10000 -storetype PKCS12 \
            -storepass "$STORE_PASS" -keypass "$STORE_PASS" \
            -dname "CN=Mobile Tetris, OU=Personal, O=Kimtaeyoun, L=Daejeon, C=KR"

          "$ZIPALIGN" -f -p 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"

          "$APKSIGNER" sign \
            --ks "$KS" --ks-key-alias tetris \
            --ks-pass "pass:$STORE_PASS" --key-pass "pass:$STORE_PASS" \
            --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true \
            --min-sdk-version 24 \
            --out android/tetris.apk "$RUNNER_TEMP/aligned.apk"

          "$APKSIGNER" verify --verbose --print-certs android/tetris.apk
          ls -l android/tetris.apk
          sha256sum android/tetris.apk | tee android/tetris.apk.sha256

      - name: Verify APK contents
        run: |
          python3 - <<'PY'
          import sys, zipfile
          path = "android/tetris.apk"
          z = zipfile.ZipFile(path)
          names = z.namelist()
          required = [
              "AndroidManifest.xml",
              "resources.arsc",
              "classes.dex",
              "assets/www/index.html",
              "META-INF/MANIFEST.MF",
              "META-INF/CERT.SF",
              "META-INF/CERT.RSA",
          ]
          missing = [n for n in required if n not in names]
          html = z.read("assets/www/index.html").decode("utf-8", "replace")
          print("entries:", len(names))
          print("has tetris title:", "테트리스" in html)
          print("files:", [n for n in names if n.startswith("assets/")])
          if missing:
              print("::error::missing entries:", missing)
              sys.exit(1)
          print("APK content check OK")
          PY

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tetris-apk
          path: |
            android/tetris.apk
            android/tetris.apk.sha256
          if-no-files-found: error
          retention-days: 30
